name: Sitemap Watch
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs to probe, one per line"
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe sitemaps
        env:
          URLS: ${{ inputs.urls }}
        run: |
          printf '%s\n' "$URLS" | while IFS= read -r u; do
            [ -z "$u" ] && continue
            body=$(mktemp)
            code=$(curl -s -o "$body" -w '%{http_code}' -m 30 -A 'Mozilla/5.0 (compatible; SKMWatch/1.0)' "$u")
            locs=$(grep -o '<loc>' "$body" | wc -l | tr -d ' ')
            root=$(head -c 400 "$body" | tr -d '\n' | grep -o -E '<sitemapindex|<urlset' | head -1 | tr -d '<')
            bytes=$(wc -c < "$body" | tr -d ' ')
            echo "RESULT|$code|$locs|${root:-none}|$bytes|$u"
            rm -f "$body"
          done
