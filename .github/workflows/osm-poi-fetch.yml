name: OSM POI Fetch

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch named POIs around each market
        run: python scripts/fetch_osm_pois.py
      - name: Commit POI snapshot (even partial)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm-pois.json
          git commit -m "data: OSM POI snapshot for market shop enrichment" || echo "no changes"
          git push
