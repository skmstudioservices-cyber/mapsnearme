name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: URL patterns in sitemap
        run: |
          set -e
          grep -n "categoryUrls\|businessUrls\|/b/\|/category\|loc:" src/pages/sitemap.xml.ts | head -25
