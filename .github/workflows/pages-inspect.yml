name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: verify static sitemap live
        run: |
          set +e
          for p in "sitemap.xml" "robots.txt"; do
            code=$(curl -s -o /tmp/f -w "%{http_code}" --max-time 25 -A "Mozilla/5.0" "https://mapsnearme.pages.dev/$p")
            echo "/$p -> HTTP $code ($(wc -c < /tmp/f)b)"
          done
          echo "--- robots tail ---"; curl -s --max-time 20 "https://mapsnearme.pages.dev/robots.txt" | tail -3
          echo "--- sitemap head ---"; curl -s --max-time 25 "https://mapsnearme.pages.dev/sitemap.xml" | head -c 300
          echo; echo "--- sitemap URL count ---"; curl -s --max-time 30 "https://mapsnearme.pages.dev/sitemap.xml" | grep -c "<loc>"
